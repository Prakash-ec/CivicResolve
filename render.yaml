# CivicResolve Multi-Service Render Blueprint
# Architecture: High-Availability Frontend Static Site + Express Backend Web Service

services:
  # 1. CivicResolve Backend API Web Service
  - type: web
    name: civicresolve-backend
    runtime: node
    plan: free
    region: singapore # Closest low-latency region to India
    buildCommand: npm --prefix server install && npm --prefix server run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://civicresolve.onrender.com
      - key: FIREBASE_PROJECT_ID
        value: civicresolve-969d3
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  # 2. CivicResolve React SPA Static Site
  - type: web
    name: civicresolve-frontend
    runtime: static
    plan: free
    region: singapore
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://civicresolve-backend.onrender.com/api
      - key: VITE_FIREBASE_PROJECT_ID
        value: civicresolve-969d3
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: civicresolve-969d3.firebaseapp.com
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: civicresolve-969d3.appspot.com
      - key: VITE_FIREBASE_APP_ID
        value: 1:408037973858:web:3ae53468fabf9e3375563b
